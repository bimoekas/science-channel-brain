<template>
<style>
#root{position:absolute;inset:0;overflow:hidden;background:#0d182b;font-family:Inter,system-ui,sans-serif;color:#f4f7fb}
#top-badge{position:absolute;left:50%;top:180px;transform:translateX(-50%);padding:10px 28px;background:#f59e0b;border-radius:30px;color:#1c1917;font-size:26px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase}
#title-banner{position:absolute;left:50%;top:250px;transform:translateX(-50%);width:740px;padding:20px;background:#b45309;border:3px solid #fef3c7;border-radius:24px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,0.3)}

#stage-card{position:absolute;left:90px;top:400px;width:900px;height:900px;background:#fbf7ee;border:4px solid #1e293b;border-radius:36px;box-shadow:0 16px 0 rgba(0,0,0,0.25);overflow:hidden;position:relative}

/* SVG Illustration Canvas */
#scene-svg{position:absolute;inset:0;width:100%;height:100%}

/* Step Indicator Tag */
#step-badge{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#1e293b;border:3px solid #fde047;border-radius:20px;padding:12px 32px;font-size:28px;font-weight:900;color:#fde047;text-align:center}
</style>

<div id="root" data-composition-id="s3-mechanism" data-width="1080" data-height="1920">
  <div class="clip" data-start="0" data-duration="16.00" data-track-index="1">
    <div id="top-badge">MEKANISME SAINS 2D</div>
    <div id="title-banner"><h2>KILATAN PETIR JADI KACA</h2></div>

    <div id="stage-card">
      <svg id="scene-svg" viewBox="0 0 900 900">
        <!-- Latar Tanah Bawah Tanah -->
        <rect x="0" y="320" width="900" height="580" fill="#fef08a" />
        <line x1="0" y1="320" x2="900" y2="320" stroke="#ca8a04" stroke-width="8" />
        <text x="70" y="370" font-family="Inter,sans-serif" font-size="28" font-weight="900" fill="#854d0e">LAPISAN PASIR PANTAI</text>

        <!-- Butiran Pasir Bertebaran -->
        <g id="sand-grains" fill="#d97706" opacity="0.6">
          <circle cx="200" cy="420" r="8"/>
          <circle cx="350" cy="480" r="10"/>
          <circle cx="520" cy="410" r="7"/>
          <circle cx="680" cy="500" r="9"/>
          <circle cx="250" cy="620" r="8"/>
          <circle cx="600" cy="680" r="11"/>
        </g>

        <!-- 1. Sambaran Kilat Petir 2D Menghujam Tanah -->
        <path id="lightning-strike" d="M450 0 L420 180 L480 180 L430 320" fill="none" stroke="#facc15" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 2. Gelombang Ledakan Panas di Titik Tumbuk (Detik 3.7 - Meleleh) -->
        <circle id="heat-wave" cx="430" cy="320" r="20" fill="#f97316" opacity="0"/>
        <circle id="heat-wave-outer" cx="430" cy="320" r="40" fill="none" stroke="#ef4444" stroke-width="8" opacity="0"/>

        <!-- 3. Jalur Tabung Fulgurit Kaca Cabang di Bawah Tanah (Detik 6.6) -->
        <!-- Batang Utama Tabung Kaca -->
        <path id="fulgurite-main" d="M430 320 Q440 450 420 540 T460 720" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/>
        <!-- Inti Berongga Tabung Kaca -->
        <path id="fulgurite-core" d="M430 320 Q440 450 420 540 T460 720" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Cabang Kaca Kiri -->
        <path id="fulgurite-branch-1" d="M425 460 Q340 500 300 580" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
        <path id="fulgurite-branch-1-core" d="M425 460 Q340 500 300 580" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>

        <!-- Cabang Kaca Kanan -->
        <path id="fulgurite-branch-2" d="M430 570 Q520 620 580 700" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
        <path id="fulgurite-branch-2-core" d="M430 570 Q520 620 580 700" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>

        <!-- Kilauan Efek Kaca (Sparkles) -->
        <g id="sparkles" opacity="0">
          <polygon points="460,400 466,415 481,421 466,427 460,442 454,427 439,421 454,415" fill="#ffffff"/>
          <polygon points="310,540 314,550 324,554 314,558 310,568 306,558 296,554 306,550" fill="#ffffff"/>
          <polygon points="560,650 564,660 574,664 564,668 560,678 556,668 546,664 556,660" fill="#ffffff"/>
        </g>
      </svg>

      <div id="step-badge">⚡ 1. SUHU EKSTREM 30.000°C</div>
    </div>
  </div>
</div>

<script>
(function(){
  const tl = gsap.timeline({ paused: true });
  const DUR = 16.00;

  // Setup panjang path SVG agar bisa beranimasi tumbuh (drawSVG effect)
  const paths = [
    "#fulgurite-main", "#fulgurite-core",
    "#fulgurite-branch-1", "#fulgurite-branch-1-core",
    "#fulgurite-branch-2", "#fulgurite-branch-2-core"
  ];

  paths.forEach(sel => {
    const el = document.querySelector(sel);
    if(el){
      const len = el.getTotalLength ? el.getTotalLength() : 500;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    }
  });

  // Entrance Card
  tl.fromTo("#stage-card", {scale:0.92, opacity:0}, {scale:1, opacity:1, duration:0.5, ease:"back.out(1.4)"}, 0.2);

  // 1. Animasi Sambaran Petir (0s - 3.5s)
  tl.fromTo("#lightning-strike", {opacity:0, scaleY:0.3}, {opacity:1, scaleY:1, duration:0.2, repeat:5, yoyo:true, ease:"power4.in"}, 0.8);

  // 2. Pas kata MELELEH (detik 3.7 di scene, ~28.7s audio)
  tl.call(() => {
    document.getElementById("step-badge").innerText = "🔥 2. PASIR MELELEH INSTAN";
    document.getElementById("step-badge").style.borderColor = "#ef4444";
    document.getElementById("step-badge").style.color = "#fca5a5";
  }, null, 3.5);

  tl.fromTo("#heat-wave", {scale:0, opacity:1}, {scale:3.5, opacity:0, duration:0.8, ease:"power2.out"}, 3.7);
  tl.fromTo("#heat-wave-outer", {scale:0, opacity:1}, {scale:4.5, opacity:0, duration:1.0, ease:"power2.out"}, 3.7);

  // 3. Pas kata MEMBEKU JADI TABUNG KACA (detik 6.6 di scene, ~31.6s audio)
  tl.call(() => {
    document.getElementById("step-badge").innerText = "💎 3. MEMBEKU JADI TABUNG KACA!";
    document.getElementById("step-badge").style.borderColor = "#38bdf8";
    document.getElementById("step-badge").style.color = "#38bdf8";
  }, null, 6.4);

  // Tabung kaca utama tumbuh ke bawah tanah
  tl.to(["#fulgurite-main", "#fulgurite-core"], {strokeDashoffset: 0, duration: 1.8, ease:"power2.out"}, 6.6);
  // Cabang-cabang kaca ikut bercabang
  tl.to(["#fulgurite-branch-1", "#fulgurite-branch-1-core"], {strokeDashoffset: 0, duration: 1.2, ease:"power2.out"}, 7.4);
  tl.to(["#fulgurite-branch-2", "#fulgurite-branch-2-core"], {strokeDashoffset: 0, duration: 1.2, ease:"power2.out"}, 7.9);

  // Kilauan kaca berkilau
  tl.to("#sparkles", {opacity: 1, duration: 0.4, repeat: 4, yoyo: true}, 9.0);

  tl.set({}, {}, DUR);
  window.__timelines = window.__timelines || {};
  window.__timelines["s3-mechanism"] = tl;
})();
</script>
</template>
