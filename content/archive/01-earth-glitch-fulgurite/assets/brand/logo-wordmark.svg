<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="NGGAK PENTING.">
  <!-- Primary horizontal wordmark: editorial all-caps, tight tracking,
       with a single glitch slice through the final period. -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="62" font-weight="900"
     fill="#F5F3EF" letter-spacing="-2.6">
    <text x="0" y="82">NGGAK</text>
    <text x="214" y="82">PENTING</text>
  </g>
  <!-- the period, split into two shards -->
  <rect x="474" y="62" width="15" height="8" fill="#F5F3EF"/>
  <rect x="481" y="72" width="15" height="10" fill="#FF5A2F"/>
</svg>
