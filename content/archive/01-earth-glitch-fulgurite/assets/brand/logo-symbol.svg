<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nggak Penting Lab">
  <!-- Standalone symbol: a question mark whose stem is sliced by a signal break.
       Reads at 16px. Two inks only: off-white + one accent shard. -->
  <g fill="none" stroke="#F5F3EF" stroke-width="7" stroke-linecap="square">
    <path d="M18 20.5c0-7.2 5.6-12.5 14-12.5s14 5.3 14 12.5c0 6-3.4 9.3-8.6 12.2-3.3 1.9-4.9 3.6-4.9 6.8v2.5"/>
  </g>
  <g>
    <rect x="29.5" y="47" width="7" height="7" fill="#F5F3EF"/>
  </g>
  <!-- glitch shard: the stem displaced, in the alert accent -->
  <g>
    <rect x="27" y="34.5" width="12" height="3.5" fill="#FF5A2F"/>
    <rect x="30.5" y="30" width="6" height="2.5" fill="#FF5A2F" opacity="0.55"/>
  </g>
</svg>
