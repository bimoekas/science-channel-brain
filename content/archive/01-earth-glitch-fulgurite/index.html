<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Petir Nyulap Pasir Jadi Fosil Kaca</title>
<link rel="stylesheet" href="assets/brand/tokens.css">
<style>
  html,body{margin:0;padding:0;background:#07111f;}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07111f;}
  [data-composition-src]{position:absolute;left:0;top:0;width:1080px;height:1920px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="assets/brand/brand.js"></script>
</head>
<body>
<!-- Film: VO 48.431s (video/assets/audio/voiceover.mp3)
     S1 Hook: 0.00 - 11.75s
     S2 Fulgurit & Suhu: 11.75 - 24.95s
     S3 Mekanisme Kaca: 24.95 - 40.95s
     S4 Kesimpulan: 40.95 - 45.75s
     Signature Outro: 45.75 - 48.50s (Tagline: "Penting ga penting...") -->
<div id="root" data-composition-id="main" data-start="0" data-duration="48.5" data-width="1080" data-height="1920" data-resolution="portrait">
  <audio id="voiceover" data-hf-id="hf-voiceover-main" class="clip" src="assets/audio/voiceover.mp3" data-start="0" data-duration="48.43" data-track-index="3" data-volume="1" style="z-index: 10"></audio>

  <div class="clip" id="scene-1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="11.75" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-2-setup" data-composition-id="s2-setup" data-composition-src="compositions/s2-setup.html" data-start="11.75" data-duration="13.20" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-3-mechanism" data-composition-id="s3-mechanism" data-composition-src="compositions/s3-mechanism.html" data-start="24.95" data-duration="16.00" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-4-impact" data-composition-id="s4-impact" data-composition-src="compositions/s4-impact.html" data-start="40.95" data-duration="4.80" data-track-index="1" data-width="1080" data-height="1920"></div>

  <!-- Brand watermark: tampil sepanjang video sampai outro -->
  <div class="clip" id="brand-watermark" data-composition-id="watermark" data-composition-src="compositions/brand/watermark.html" data-start="0" data-duration="45.75" data-track-index="2" data-width="1080" data-height="1920" data-track-kind="graphics"></div>

  <!-- Captions layer: sinkron 100% dengan audio voiceover -->
  <div class="clip" id="brand-captions" data-composition-id="captions" data-composition-src="compositions/brand/captions.html" data-start="0" data-duration="48.5" data-track-index="4" data-width="1080" data-height="1920" data-track-kind="captions"></div>

  <!-- Signature outro: mengunci tepat di awal kalimat tagline penutup (45.75s) -->
  <div class="clip" id="brand-signature-outro" data-composition-id="signature-outro" data-composition-src="compositions/brand/signature-outro.html" data-start="45.75" data-duration="2.75" data-track-index="5" data-width="1080" data-height="1920" data-track-kind="graphics"></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = gsap.timeline({ paused: true });
  window.__timelines["main"].set({}, {}, 48.5);
</script>
</body>
</html>
