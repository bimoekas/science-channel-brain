<script>
(function(){
  const tl = gsap.timeline({ paused: true });
  const DUR = 9.50;

  tl.fromTo("#stage-card", {scale:0.92, opacity:0}, {scale:1, opacity:1, duration:0.5, ease:"back.out(1.4)"}, 0.2);

  // Kata "MENYEMPIT!" di detik 0.0 scene (~26.75s film)

  tl.fromTo("#shrink-arrows", {opacity:0, scale:0.7}, {opacity:1, scale:1, duration:0.4, repeat:3, yoyo:true}, 0.6);

})();
