<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>1816, Tahun Tanpa Musim Panas</title>
<link rel="stylesheet" href="assets/brand/tokens.css">
<style>
  html,body{margin:0;padding:0;background:#07111f;}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07111f;}
  [data-composition-src]{position:absolute;left:0;top:0;width:1080px;height:1920px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="assets/brand/brand.js"></script>
</head>
<body>
<!-- Film = VO (68.597s) + 2.3s signature outro. The current voiceover.mp3 is the
     pre-tagline take, so the outro plays after the voice stops; when the VO is
     regenerated with the spoken tagline (~+2.5-3s), re-measure and move the
     outro's data-start to the start of that line. -->
<div id="root" data-composition-id="main" data-start="0" data-duration="70.9" data-width="1080" data-height="1920" data-resolution="portrait">
  <div class="clip" id="scene-1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="9" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-2-eruption" data-composition-id="s2-eruption" data-composition-src="compositions/s2-eruption.html" data-start="9" data-duration="11" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-3-mechanism" data-composition-id="s3-mechanism" data-composition-src="compositions/s3-mechanism.html" data-start="20" data-duration="18" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-4-effects" data-composition-id="s4-effects" data-composition-src="compositions/s4-effects.html" data-start="38" data-duration="9" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-5-frankenstein" data-composition-id="s5-frankenstein" data-composition-src="compositions/s5-frankenstein.html" data-start="47" data-duration="13" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" id="scene-6-closing" data-composition-id="s6-closing" data-composition-src="compositions/s6-closing.html" data-start="60" data-duration="8.6" data-track-index="1" data-width="1080" data-height="1920"></div>

  <!-- Brand layer: mounted once for the whole film, never per scene. -->
  <div class="clip" id="brand-watermark" data-composition-id="watermark" data-composition-src="compositions/brand/watermark.html" data-start="0" data-duration="68.6" data-track-index="2" data-width="1080" data-height="1920" data-track-kind="graphics"></div>
  <div class="clip" id="brand-captions" data-composition-id="captions" data-composition-src="compositions/brand/captions.html" data-start="0" data-duration="68.6" data-track-index="4" data-width="1080" data-height="1920" data-track-kind="captions"></div>
  <div class="clip" id="brand-signature-outro" data-composition-id="signature-outro" data-composition-src="compositions/brand/signature-outro.html" data-start="68.6" data-duration="2.3" data-track-index="5" data-width="1080" data-height="1920" data-track-kind="graphics"></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = gsap.timeline({ paused: true });
  window.__timelines["main"].set({}, {}, 70.9);
</script>
</body>
</html>
