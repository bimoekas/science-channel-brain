<template>
<style>
/* Film grain: the whole frame gets one thin, moving sensor layer. The texture
   is a fixed-seed SVG turbulence, so every render is identical; the motion
   comes from NPL.grain(), which nudges the oversized layer a few pixels on
   steps — alive without motion spam. Mounted once at the root, over every
   scene and caption, exactly like grain sits over a lens. */
#root{position:absolute;inset:0;pointer-events:none}
/* .03, not more: grain lifts the black ground, and 4.5% pushed the dimmed
   gray type in s7 under WCAG AA (2.98:1). */
#grain{position:absolute;inset:-40px;opacity:.03;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' seed='11'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:240px 240px}
</style>
<div id="root" data-composition-id="grain" data-width="1080" data-height="1920">
  <div class="clip" id="grain-stage" data-start="0" data-duration="101.60" data-track-index="1">
    <div id="grain"></div>
  </div>
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const DUR = 101.60;
  NPL.grain(tl, "#grain", DUR, {seed: 7, step: 0.12});
  tl.set({}, {}, DUR);
  window.__timelines["grain"] = tl;
})();
</script>
</template>
