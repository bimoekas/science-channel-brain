<template>
<style>
/* Signature outro: simpel & ringan (fade only), holds to clip duration. */
#root{position:absolute;inset:0;overflow:hidden;background:var(--npl-black)}
#o-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 var(--npl-margin)}
#o-logo{display:block;width:760px;max-width:100%;height:auto}
</style>
<div id="root" data-composition-id="signature-outro" data-width="1080" data-height="1920">
  <div class="clip" id="o-stage" data-start="0" data-duration="2.10" data-track-index="1">
    <div id="o-wrap">
      <img id="o-logo" src="assets/brand/logo-stacked-primary.svg" alt="SINI AKU CERITAIN">
    </div>
  </div>
</div>
<script>
(function(){
  const tl = gsap.timeline({ paused: true });
  const host = document.querySelector('[data-composition-id="signature-outro"] .clip');
  const DUR = parseFloat(host && host.getAttribute('data-duration')) || 2.10;
  tl.fromTo("#o-stage", {opacity:0}, {opacity:1, duration:0.25, ease:"power2.out"}, 0);
  tl.fromTo("#o-logo", {opacity:0, y:14}, {opacity:1, y:0, duration:0.22, ease:"power2.out"}, 0.02);
  tl.set({}, {}, DUR);
  window.__timelines = window.__timelines || {};
  window.__timelines["signature-outro"] = tl;
})();
</script>
</template>
