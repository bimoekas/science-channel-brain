<script>
(function(){
  /* local = abs - 93.76 */
  const tl = gsap.timeline({ paused: true });
  const DUR = 7.84;
  const ticks = document.querySelectorAll("#s11-ruler i");
  const rnd = NPL.rng(41);
  Array.prototype.forEach.call(ticks, function(el, i){

  tl.fromTo("#s11-glow", {opacity:0}, {opacity:1, duration:.90, ease:"power2.inOut"}, 4.24);
  tl.set({}, {}, DUR);
  window.__timelines = window.__timelines || {};
  window.__timelines["s11-payoff"] = tl;
})();
