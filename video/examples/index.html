<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>NGGAK PENTING LAB — Brand System Demo</title>
<link rel="stylesheet" href="assets/brand/tokens.css">
<style>
  html,body{margin:0;padding:0;background:var(--npl-black);}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--npl-black);}
  [data-composition-src]{position:absolute;left:0;top:0;width:1080px;height:1920px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="assets/brand/brand.js"></script>
</head>
<body>
<!-- Demo reel: the three pillar looks plus the signature outro, in order.
     Not part of any episode. Render with:
       npx hyperframes render . -c examples/index.html
     Sub-composition paths resolve from the project root, not this folder. -->
<div id="root" data-composition-id="brand-demo" data-start="0" data-duration="20" data-width="1080" data-height="1920" data-resolution="portrait">
  <div class="clip" data-composition-id="eg-example" data-composition-src="examples/earth-glitch.html" data-start="0" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" data-composition-id="hm-example" data-composition-src="examples/human-madness.html" data-start="6" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" data-composition-id="sf-example" data-composition-src="examples/sci-fi-parody.html" data-start="12" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>
  <div class="clip" data-composition-id="signature-outro" data-composition-src="compositions/brand/signature-outro.html" data-start="18" data-duration="2" data-track-index="2" data-width="1080" data-height="1920" data-track-kind="graphics"></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines["brand-demo"] = gsap.timeline({ paused: true });
  window.__timelines["brand-demo"].set({}, {}, 20);
</script>
</body>
</html>
